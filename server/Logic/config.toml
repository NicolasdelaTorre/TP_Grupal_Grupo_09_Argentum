FClassMeditation = 10.0

[class.warrior]
FClassHealth = 20.0
FClassMana = 0.0
FClassMeditation = 0.0

# ============================================================================
# Fórmulas
# ============================================================================

[formula.gold]
# OroSeguro(Nivel) = safeBase * Nivel^safeExp
safeBase = 100.0
safeExp = 1.1
# OroMax(Nivel) = OroSeguro * maxFactor
maxFactor = 1.5

[formula.experience]
# ExpProxNivel(Nivel) = nextBase * Nivel^nextExp
nextBase = 1000.0
nextExp = 1.8
# Bonus por matar al objetivo: rand(0, killBonusMaxPct/100) * VidaMaxOtro
killBonusMaxPct = 10
# Factor por golpe: max(0, NivelOtro - NivelAtacante + levelDiffBase)
levelDiffBase = 10

[formula.combat]
# Evasion (enunciado): rand(0,1)^Agilidad < evadeThreshold => esquiva.
evadeThreshold = 0.001
# Crítico: chance entera en %. El crítico hace doble daño y no puede ser esquivado.
criticalChancePct = 5

[formula.fairplay]
# Nivel maximo para ser "newbie". Newbies no pueden atacar ni ser atacados.
newbieLevel = 2
# Diferencia maxima de niveles permitida entre atacante y target.
maxLevelDiff = 10

# ============================================================================
# Loot de criaturas
