# Formulas del enunciado
[formula.gold]
# OroSeguro(Nivel) = safeBase * Nivel^safeExp
safeBase = 100.0
safeExp = 1.1
# OroMax(Nivel) = OroSeguro * maxFactor
maxFactor = 1.5

[formula.experience]
# ExpProxNivel(Nivel) = nextBase * Nivel^nextExp
nextBase = 1000.0
nextExp = 1.8
# Bonus por matar al objetivo: rand(0, killBonusMaxPct/100) * VidaMaxOtro
killBonusMaxPct = 10
# Factor por golpe: max(0, NivelOtro - NivelAtacante + levelDiffBase)
levelDiffBase = 10

[formula.combat]
# Evasion (enunciado): rand(0,1)^Agilidad < evadeThreshold => esquiva.
evadeThreshold = 0.001
# Crítico: chance entera en %. El crítico hace doble daño y no puede ser esquivado.
criticalChancePct = 5

# Fair play (enunciado). Aplica solo en PvP.
[formula.fairplay]
# Nivel maximo para ser "newbie". Newbies no pueden atacar ni ser atacados.
newbieLevel = 2
# Diferencia maxima de niveles permitida entre atacante y target.
maxLevelDiff = 10

# Loot al matar criaturas (probabilidades acumuladas en % sobre 100).
[loot.npc]
nothingChance = 80
goldChance = 8
potionChance = 1
itemChance = 1
# Oro dropeado = rand(goldFactorMinPct..goldFactorMaxPct) / 100 * VidaMaxNPC
goldFactorMinPct = 1
goldFactorMaxPct = 20
# Pool de itemIds posibles cuando dropea objeto.
itemIdMin = 1
itemIdMax = 17
# Ids de pociones (50/50 entre las dos).
potionHealthId = 18
potionManaId = 19

# Rangos de nivel para spawn de criaturas segun zona.
[creature.spawn]
overworldLevelMin = 1
overworldLevelMax = 5
dungeonLevelMin = 5
dungeonLevelMax = 10
